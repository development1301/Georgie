    <style>
      /* Mobile Performance & Layout Optimizations - V6 (Perfect Mobile Sync) */
      @media (max-width: 768px) {
        /* 1. Prevent Horizontal Scroll Lag */
        html, body {
          overflow-x: hidden !important;
          -webkit-tap-highlight-color: transparent;
        }

        /* 2. Disable heavy backdrop blurs on mobile */
        * {
          backdrop-filter: none !important;
          -webkit-backdrop-filter: none !important;
        }
        
        /* 3. Disable heavy box shadows */
        .ga-signature-scene__card, 
        .ga-signature-scene__card *,
        [class*="shadow"] {
          box-shadow: none !important;
        }

        /* 4. Hardware acceleration for videos */
        video {
          transform: translateZ(0);
          will-change: transform, opacity;
        }
        
        /* 5. Ultimate Scroll-Stuck Fix: Completely strip GSAP pinning on mobile */
        /* GSAP pinning calculates pixels dynamically which breaks on mobile native scroll */
        .pin-spacer {
          position: relative !important;
          padding: 0 !important;
          height: auto !important;
          min-height: auto !important;
          display: block !important;
        }
        
        .pin-spacer > * {
          position: relative !important;
          transform: none !important;
          left: auto !important;
          top: auto !important;
          width: 100% !important;
          height: auto !important;
          max-width: 100% !important;
          box-sizing: border-box !important;
        }
        
        /* Remove GSAP transforms on heavy animated sections */
        .ga-signature-scene, .ga-signature-transition {
          transform: none !important;
        }

        /* 6. Force native scroll and eliminate Lenis Javascript interference */
        html.lenis, html.lenis body {
          height: auto !important;
          overflow-y: auto !important;
          scroll-behavior: auto !important;
          overscroll-behavior-y: auto !important;
        }
        
        /* 7. Text Rendering & Squish Fixes */
        body {
          text-rendering: optimizeSpeed;
          -webkit-font-smoothing: antialiased;
        }
        
        .md\:w-1\/2 {
          width: 100% !important;
        }
        
        .p-12, .px-12 {
          padding-left: 1rem !important;
          padding-right: 1rem !important;
        }
      }
    </style>
