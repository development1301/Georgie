    <style>
      /* Mobile Performance & Layout Optimizations - V4 (Scroll Stuck Fix) */
      @media (max-width: 768px) {
        /* 1. Disable heavy backdrop blurs on mobile as they cause severe scroll lag */
        * {
          backdrop-filter: none !important;
          -webkit-backdrop-filter: none !important;
        }
        
        /* 2. Disable heavy box shadows on cards and floating elements */
        .ga-signature-scene__card, 
        .ga-signature-scene__card *,
        [class*="shadow"] {
          box-shadow: none !important;
        }

        /* 3. Hardware acceleration for videos to prevent paint lag */
        video {
          transform: translateZ(0);
          will-change: transform, opacity;
        }
        
        /* 4. Fix specific layout issues that squish on mobile without breaking GSAP */
        /* Revert the height: auto which broke GSAP pin calculations */
        .h-screen {
          height: 100dvh !important; 
        }
        
        .md\:w-1\/2 {
          width: 100% !important;
        }
        
        .p-12, .px-12 {
          padding-left: 1rem !important;
          padding-right: 1rem !important;
        }

        /* 5. Prevent Lenis/GSAP jitter on touch screens */
        html.lenis, html.lenis body {
          overscroll-behavior-y: none;
        }
      }
      
      /* Global scroll fixes for GSAP */
      .pin-spacer {
        /* Prevent layout thrashing when GSAP pins/unpins */
        padding: 0 !important;
      }
      
      /* If Lenis is intercepting too much on mobile, we can optionally enforce native touch behavior */
      @media (max-width: 768px) {
        .lenis {
          touch-action: pan-y !important;
        }
      }
    </style>
